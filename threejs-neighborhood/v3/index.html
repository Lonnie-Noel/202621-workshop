<!doctype html>
<html lang="ko">
<head>

<style>
:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:none;user-select:none}#c{display:block;width:100%;height:100%}#hud{position:fixed;left:14px;top:14px;z-index:5;width:min(360px,calc(100vw - 28px));box-sizing:border-box;color:#fff;background:linear-gradient(180deg,rgba(20,38,58,.82),rgba(8,18,32,.72));border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:14px 15px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{margin:0 0 8px;font-size:18px;letter-spacing:-.03em}.row{display:flex;justify-content:space-between;gap:12px;color:rgba(255,255,255,.74);font-size:13px;margin-top:6px}.v{color:#fff;font-weight:900;text-align:right}.bar{height:9px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:11px}#stamina{height:100%;width:100%;background:linear-gradient(90deg,#79ffd4,#8cc7ff,#ffd36e)}#tip{margin-top:10px;font-size:12px;color:rgba(255,255,255,.68);line-height:1.45}#mini{position:fixed;right:14px;top:14px;z-index:5;width:132px;height:132px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(7,17,31,.72);backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(0,0,0,.22)}#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;max-width:min(560px,calc(100vw - 28px));color:white;background:rgba(9,19,33,.9);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px 16px;opacity:0;transition:.25s;text-align:center;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.25)}#toast.show{opacity:1;bottom:34px}#joy{position:fixed;left:24px;bottom:24px;z-index:7;width:122px;height:122px;border-radius:999px;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.2);display:none;touch-action:none;box-shadow:inset 0 0 24px rgba(255,255,255,.08)}#nub{position:absolute;left:40px;top:40px;width:42px;height:42px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(146,220,255,.56));box-shadow:0 8px 22px rgba(0,0,0,.22)}#jump{position:fixed;right:26px;bottom:32px;z-index:7;width:78px;height:78px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(121,255,212,.28),rgba(92,169,255,.22));color:white;font-weight:900;display:none;touch-action:none;box-shadow:0 12px 34px rgba(0,0,0,.24)}@media(hover:none),(pointer:coarse){#joy,#jump{display:block}#tip{display:none}#hud{font-size:12px;width:min(330px,calc(100vw - 28px))}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<section id="hud"><h1>판타지 동네 오픈월드 v3</h1><div class="row"><span>목표</span><span class="v" id="goal">정령 조각 0 / 5</span></div><div class="row"><span>현재 위치</span><span class="v" id="place">햇살 광장</span></div><div class="row"><span>비주얼</span><span class="v">셀셰이딩 판타지</span></div><div class="bar"><div id="stamina"></div></div><div id="tip">WASD 이동 · Shift 달리기 · Space 점프 · 마우스/터치 드래그 방향 전환 · R 리셋</div></section>
<canvas id="mini" width="132" height="132"></canvas><div id="toast"></div><div id="joy"><div id="nub"></div></div><button id="jump">JUMP</button>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 260);
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
const clock = new THREE.Clock();

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
scene.background = new THREE.Color(0x8fd7ff);
scene.fog = new THREE.Fog(0x8fd7ff, 82, 188);

function makeGradientMap() {
  const canvas = document.createElement('canvas');
  canvas.width = 4;
  canvas.height = 1;
  const ctx = canvas.getContext('2d');
  ['#263448', '#6d7f8f', '#c9d7df', '#ffffff'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(i, 0, 1, 1);
  });
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
const toonGradient = makeGradientMap();
function toon(color, extra = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient, roughness: 0.82, ...extra });
}
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x243348, side: THREE.BackSide });
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.86 });
const spiritMat = new THREE.MeshToonMaterial({ color: 0xfff06f, emissive: 0xffb703, emissiveIntensity: 0.85, gradientMap: toonGradient });

const hemi = new THREE.HemisphereLight(0xfffbec, 0x7ab1e5, 1.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2c4, 2.75);
sun.position.set(-42, 76, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -92;
sun.shadow.camera.right = sun.shadow.camera.top = 92;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9bd6ff, 0.65);
fill.position.set(28, 22, -38);
scene.add(fill);

const mats = {
  grass: toon(0x62c96f), grassDark: toon(0x3d9f56), path: toon(0xd9b879), stone: toon(0xb9c1bd),
  water: toon(0x55caff, { transparent: true, opacity: 0.78 }), roof: toon(0x3577a8), roofRed: toon(0xd95a52),
  wood: toon(0x8f613d), bark: toon(0x7b4b2e), leaf: toon(0x2faa5a), leafLight: toon(0x82d45e),
  wall: toon(0xf2d8a7), wall2: toon(0xffc793), blue: toon(0x5aa9ff), red: toon(0xff5d73),
  skin: toon(0xffdfbd), tunic: toon(0x4fc7a5), boots: toon(0x4d3526), cape: toon(0x4076d8), gold: toon(0xffd56d)
};

function mesh(geometry, material, x = 0, y = 0, z = 0, outline = true) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  if (outline) {
    const o = new THREE.Mesh(geometry, outlineMat);
    o.position.copy(m.position);
    o.rotation.copy(m.rotation);
    o.scale.copy(m.scale).multiplyScalar(1.032);
    scene.add(o);
  }
  return m;
}
function box(w, h, d, material, x, y, z, outline = true) { return mesh(new THREE.BoxGeometry(w, h, d), material, x, y, z, outline); }
function cyl(r, h, material, x, y, z, seg = 18, outline = true) { return mesh(new THREE.CylinderGeometry(r, r, h, seg), material, x, y, z, outline); }
function cone(r, h, material, x, y, z, seg = 6, outline = true) { return mesh(new THREE.ConeGeometry(r, h, seg), material, x, y, z, outline); }
function sph(r, material, x, y, z, outline = true) { return mesh(new THREE.SphereGeometry(r, 20, 14), material, x, y, z, outline); }
function child(parent, geometry, material, x, y, z, outline = true) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  if (outline) {
    const o = new THREE.Mesh(geometry, outlineMat);
    o.position.copy(m.position);
    o.rotation.copy(m.rotation);
    o.scale.copy(m.scale).multiplyScalar(1.04);
    parent.add(o);
  }
  return m;
}

const world = 138;
const half = world / 2;
const colliders = [];
function col(x, z, w, d, label) { colliders.push({ x, z, w, d, label }); }

box(world, 0.18, world, mats.grass, 0, -0.09, 0, false);
box(42, 0.12, 16, mats.grassDark, -38, 0.01, 24, false);
box(32, 0.12, 22, mats.grassDark, 42, 0.02, -28, false);
for (const z of [-42, 0, 42]) box(world, 0.08, 7.2, mats.path, 0, 0.035, z, false);
for (const x of [-42, 0, 42]) box(7.2, 0.08, world, mats.path, x, 0.04, 0, false);
box(70, 0.06, 4.4, mats.water, -2, 0.07, 56, false);
box(13, 0.35, 6.5, mats.wood, 0, 0.28, 56, true);

function cottage(x, z, w, d, h, wall, roof, label) {
  box(w, h, d, wall, x, h / 2, z, true);
  const r = cone(1, 1, roof, x, h + 1.05, z, 4, true);
  r.rotation.y = Math.PI / 4;
  r.scale.set(w * 0.72, 2.3, d * 0.72);
  box(1.6, 2.1, 0.18, mats.wood, x, 1.05, z + d / 2 + 0.09, true);
  const wm = toon(0xfff1a6, { emissive: 0xffc66d, emissiveIntensity: 0.1 });
  box(1.25, 1.05, 0.12, wm, x - w * 0.28, 2.1, z + d / 2 + 0.08, true);
  box(1.25, 1.05, 0.12, wm, x + w * 0.28, 2.1, z + d / 2 + 0.08, true);
  col(x, z, w + 1.4, d + 1.4, label);
}
const sites = [
  [-55, -55, 10, 13, 6.6, mats.wall, mats.roofRed, '바람 우체국'], [-24, -58, 13, 10, 6.2, mats.wall2, mats.roof, '룬 문구점'],
  [24, -57, 16, 12, 8.2, mats.wall, mats.roof, '별빛 도서관'], [57, -56, 12, 12, 6.4, mats.wall2, mats.roofRed, '꿀빵집'],
  [-58, -24, 12, 14, 6.0, mats.wall, mats.roof, '작은 주택가'], [-24, -24, 11, 12, 5.8, mats.wall2, mats.roofRed, '작은 주택가'],
  [24, -23, 13, 13, 6.5, mats.wall, mats.roof, '버섯 카페'], [57, -24, 12, 12, 7.0, mats.wall2, mats.roof, '푸른 작업실'],
  [-58, 24, 15, 12, 6.4, mats.wall2, mats.roofRed, '햇살 시장'], [-24, 25, 12, 12, 5.8, mats.wall, mats.roof, '나무 공방'],
  [24, 24, 13, 12, 6.0, mats.wall, mats.roofRed, '약초 상점'], [58, 24, 12, 14, 6.6, mats.wall2, mats.roof, '꽃집'],
  [-56, 56, 12, 13, 6.4, mats.wall, mats.roof, '숲 학교'], [-24, 58, 13, 11, 6.0, mats.wall2, mats.roofRed, '분식 오두막'],
  [25, 56, 12, 13, 7.1, mats.wall, mats.roof, '수호대 초소'], [57, 57, 13, 12, 6.0, mats.wall2, mats.roofRed, '강변 주택가']
];
sites.forEach(s => cottage(...s));

cyl(7.4, 0.28, mats.stone, 0, 0.16, 0, 40, true);
cyl(2.4, 0.8, mats.water, 0, 0.65, 0, 32, true);
for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2;
  const p = sph(0.32, mats.water, Math.cos(a) * 3.4, 1.25 + Math.sin(i) * 0.2, Math.sin(a) * 3.4, false);
  p.userData.float = i;
}
col(0, 0, 6.8, 6.8, '햇살 분수 광장');
box(10, 0.65, 1.2, mats.wood, 43, 0.42, -10, true);
box(10, 3.1, 0.25, toon(0xa7e8ff, { transparent: true, opacity: 0.55 }), 43, 2.0, -10.8, false);
col(43, -10, 9, 2, '유리 버스정류장');

function tree(x, z, kind = 0) {
  cyl(0.5, 2.7, mats.bark, x, 1.35, z, 8, true);
  if (kind % 2 === 0) {
    sph(2.1, mats.leaf, x, 3.1, z, true);
    sph(1.5, mats.leafLight, x - 0.75, 3.7, z + 0.35, true);
  } else {
    const a = cone(2.3, 3.2, mats.leaf, x, 3.0, z, 7, true);
    const b = cone(1.8, 2.6, mats.leafLight, x, 4.1, z, 7, true);
    a.rotation.y = b.rotation.y = 0.25;
  }
  col(x, z, 3.8, 3.8, '향기 나무');
}
let seed = 7;
function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
for (const p of [[-61, -3], [-54, 3], [-58, 7], [-64, 5], [38, -38], [52, -34], [45, -45], [60, -40]]) tree(p[0], p[1], p[0]);
for (let i = 0; i < 48; i++) {
  const x = Math.round((rand() * 124 - 62) / 4) * 4;
  const z = Math.round((rand() * 124 - 62) / 4) * 4;
  if (Math.abs(x) % 42 < 8 || Math.abs(z) % 42 < 8 || Math.hypot(x, z) < 15) continue;
  tree(x, z, i);
}

const flowerColors = [0xff6b9d, 0xffd166, 0x80ed99, 0xa0c4ff, 0xffffff];
for (let i = 0; i < 180; i++) {
  const x = rand() * 126 - 63;
  const z = rand() * 126 - 63;
  if (Math.abs(x) % 42 < 7 || Math.abs(z) % 42 < 7 || Math.hypot(x, z) < 10) continue;
  const stem = cone(0.08, 0.55, mats.grassDark, x, 0.28, z, 5, false);
  stem.rotation.x = (rand() - 0.5) * 0.35;
  sph(0.18, toon(flowerColors[i % flowerColors.length]), x, 0.62, z, false);
}

for (let i = 0; i < 7; i++) {
  const m = cone(10 + i * 2, 24 + i * 2, toon(i % 2 ? 0x8aa7b8 : 0x6c8aa0), -78 + i * 26, 12, -82, 5, false);
  m.rotation.y = i * 0.4;
}
function makeCloud(x, y, z, s) {
  const g = new THREE.Group();
  for (const p of [[0, 0, 0, 1.5], [1.4, 0.1, 0.1, 1.1], [-1.3, 0, 0.2, 1.0], [0.2, 0.45, -0.1, 1.0]]) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(p[3] * s, 18, 10), cloudMat);
    c.position.set(p[0] * s, p[1] * s, p[2] * s);
    g.add(c);
  }
  g.position.set(x, y, z);
  g.userData.speed = 0.4 + rand() * 0.4;
  scene.add(g);
  return g;
}
const clouds = [makeCloud(-48, 34, -40, 1.6), makeCloud(20, 38, -58, 1.25), makeCloud(58, 33, -22, 1.45), makeCloud(-18, 36, 38, 1.2)];

const windmill = new THREE.Group();
child(windmill, new THREE.CylinderGeometry(1.3, 2.2, 11, 8), mats.wall, 0, 5.5, 0, true);
const wr = child(windmill, new THREE.ConeGeometry(2.5, 2.2, 6), mats.roofRed, 0, 12.1, 0, true);
wr.rotation.y = 0.5;
const blades = new THREE.Group();
for (let i = 0; i < 4; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.45, 4.2, 0.18), mats.wood);
  b.position.y = 2.2;
  b.rotation.z = i * Math.PI / 2;
  blades.add(b);
}
blades.position.set(0, 8.6, 1.35);
blades.rotation.x = Math.PI / 2;
windmill.add(blades);
windmill.position.set(-50, 0, 44);
windmill.rotation.y = Math.PI * 0.25;
scene.add(windmill);
col(-50, 44, 5, 5, '바람 방앗간');

const player = new THREE.Group();
const body = child(player, new THREE.CylinderGeometry(0.72, 0.82, 1.65, 18), mats.tunic, 0, 1.13, 0, true);
child(player, new THREE.SphereGeometry(0.52, 20, 14), mats.skin, 0, 2.24, 0, true);
const cap = child(player, new THREE.ConeGeometry(0.62, 0.78, 7), mats.cape, 0.08, 2.86, -0.08, true);
cap.rotation.x = -0.18;
child(player, new THREE.BoxGeometry(0.72, 0.35, 0.24), mats.boots, -0.34, 0.28, 0.05, true);
child(player, new THREE.BoxGeometry(0.72, 0.35, 0.24), mats.boots, 0.34, 0.28, 0.05, true);
child(player, new THREE.BoxGeometry(0.28, 1.0, 0.55), mats.cape, 0, 1.25, 0.78, true);
const shield = child(player, new THREE.CylinderGeometry(0.42, 0.42, 0.12, 6), mats.gold, -0.8, 1.32, 0.15, true);
shield.rotation.z = Math.PI / 2;
scene.add(player);

const spirits = [];
for (const [name, x, z] of [['카페', 24, -14], ['도서관', 24, -48], ['공원', -58, 0], ['시장', -48, 24], ['학교', -56, 45]]) {
  const g = new THREE.Group();
  const gem = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, 0), spiritMat);
  gem.castShadow = true;
  g.add(gem);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.045, 8, 40), new THREE.MeshBasicMaterial({ color: 0xfff6a0, transparent: true, opacity: 0.78 }));
  halo.rotation.x = Math.PI / 2;
  g.add(halo);
  g.position.set(x, 2.05, z);
  scene.add(g);
  spirits.push({ name, x, z, mesh: g, got: false });
}

const cars = [];
function wagon(x, z, axis, dir, material) {
  const g = new THREE.Group();
  child(g, new THREE.BoxGeometry(3.2, 1.0, 1.8), material, 0, 0.72, 0, true);
  child(g, new THREE.BoxGeometry(1.55, 0.72, 1.55), toon(0xd6efff), -0.25, 1.42, 0, true);
  child(g, new THREE.CylinderGeometry(0.35, 0.35, 0.26, 12), mats.boots, -1.1, 0.3, -0.95, true);
  child(g, new THREE.CylinderGeometry(0.35, 0.35, 0.26, 12), mats.boots, 1.1, 0.3, -0.95, true);
  child(g, new THREE.CylinderGeometry(0.35, 0.35, 0.26, 12), mats.boots, -1.1, 0.3, 0.95, true);
  child(g, new THREE.CylinderGeometry(0.35, 0.35, 0.26, 12), mats.boots, 1.1, 0.3, 0.95, true);
  g.position.set(x, 0, z);
  scene.add(g);
  cars.push({ g, axis, dir, speed: 6.2 + rand() * 2.2 });
}
wagon(-60, -42, 'x', 1, mats.red);
wagon(55, 0, 'x', -1, mats.blue);
wagon(42, 58, 'z', -1, mats.red);
wagon(-42, -55, 'z', 1, mats.blue);

const state = { pos: new THREE.Vector3(0, 0, 14), velY: 0, heading: Math.PI, stamina: 1, collected: 0, place: '햇살 광장' };
const keys = new Set();
const joy = { on: false, r: 0, f: 0 };
let dragging = false;
let lastX = 0;

addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') jump(); if (e.code === 'KeyR') reset(); });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('pointerdown', e => { if (e.target.id === 'jump' || e.target.closest('#joy')) return; dragging = true; lastX = e.clientX; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);
addEventListener('pointermove', e => { if (!dragging) return; state.heading -= (e.clientX - lastX) * 0.005; lastX = e.clientX; });

const joyEl = $('joy');
const nub = $('nub');
joyEl.addEventListener('pointerdown', e => { joy.on = true; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
joyEl.addEventListener('pointermove', moveJoy);
joyEl.addEventListener('pointerup', () => { joy.on = false; joy.r = 0; joy.f = 0; nub.style.transform = 'translate(0,0)'; });
joyEl.addEventListener('pointercancel', () => { joy.on = false; joy.r = 0; joy.f = 0; nub.style.transform = 'translate(0,0)'; });
function moveJoy(e) {
  if (!joy.on) return;
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const len = Math.min(44, Math.hypot(dx, dy));
  const a = Math.atan2(dy, dx);
  const vx = Math.cos(a) * len / 44;
  const vy = Math.sin(a) * len / 44;
  joy.r = vx;
  joy.f = -vy;
  nub.style.transform = 'translate(' + (vx * 39) + 'px,' + (vy * 39) + 'px)';
}
$('jump').addEventListener('pointerdown', jump);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1900); }
function jump() { if (state.pos.y < 0.03) state.velY = 7.8; }
function reset() { state.pos.set(0, 0, 14); state.velY = 0; state.heading = Math.PI; toast('햇살 광장으로 돌아왔습니다.'); }
function input() {
  let r = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  let f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  r += joy.r;
  f += joy.f;
  const v = new THREE.Vector2(r, f);
  if (v.lengthSq() > 1) v.normalize();
  return v;
}
function blocked(nx, nz) {
  if (nx < -half + 2 || nx > half - 2 || nz < -half + 2 || nz > half - 2) return true;
  for (const c of colliders) {
    if (Math.abs(nx - c.x) < c.w / 2 + 1 && Math.abs(nz - c.z) < c.d / 2 + 1) { state.place = c.label; return true; }
  }
  return false;
}
function locate() {
  let best = '햇살 광장';
  let bd = 999;
  for (const s of sites) {
    const d = Math.hypot(state.pos.x - s[0], state.pos.z - s[1]);
    if (d < bd) { bd = d; best = s[7]; }
  }
  if (Math.hypot(state.pos.x + 58, state.pos.z) < 13) best = '정령 공원';
  if (Math.hypot(state.pos.x, state.pos.z) < 10) best = '햇살 분수 광장';
  if (Math.abs(state.pos.x) < 5 || Math.abs(state.pos.z) < 5 || Math.abs(Math.abs(state.pos.x) - 42) < 5 || Math.abs(Math.abs(state.pos.z) - 42) < 5) best = best === '햇살 분수 광장' ? best : '흙길';
  state.place = best;
}
function dampAngle(a, b, k, dt) { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * (1 - Math.exp(-k * dt)); }

function update(dt) {
  const inp = input();
  const run = (keys.has('ShiftLeft') || keys.has('ShiftRight')) && inp.lengthSq() > 0.01 && state.stamina > 0.05;
  const speed = run ? 12.2 : 7.2;
  state.stamina = run ? Math.max(0, state.stamina - dt * 0.23) : Math.min(1, state.stamina + dt * 0.16);
  const fwd = new THREE.Vector3(Math.sin(state.heading), 0, Math.cos(state.heading));
  const right = new THREE.Vector3(-Math.cos(state.heading), 0, Math.sin(state.heading));
  const move = fwd.multiplyScalar(inp.y).add(right.multiplyScalar(inp.x));
  if (move.lengthSq() > 1) move.normalize();
  const dx = move.x * speed * dt;
  const dz = move.z * speed * dt;
  if (!blocked(state.pos.x + dx, state.pos.z)) state.pos.x += dx;
  if (!blocked(state.pos.x, state.pos.z + dz)) state.pos.z += dz;
  state.velY -= 22 * dt;
  state.pos.y = Math.max(0, state.pos.y + state.velY * dt);
  if (state.pos.y === 0) state.velY = 0;
  if (move.lengthSq() > 0.001) {
    const h = Math.atan2(move.x, move.z);
    state.heading = dampAngle(state.heading, h, 8, dt);
    player.rotation.y = state.heading - Math.PI;
    body.scale.y = 1 + Math.sin(clock.elapsedTime * 12) * 0.035;
  }
  player.position.copy(state.pos);
  locate();
  windmill.children[2].rotation.z += dt * 1.8;
  clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > 88) c.position.x = -88; });
  for (const c of cars) {
    c.g.position[c.axis] += c.dir * c.speed * dt;
    if (c.g.position[c.axis] > 66) c.g.position[c.axis] = -66;
    if (c.g.position[c.axis] < -66) c.g.position[c.axis] = 66;
    c.g.rotation.y = c.axis === 'x' ? (c.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (c.dir > 0 ? 0 : Math.PI);
  }
  for (const s of spirits) {
    if (s.got) continue;
    s.mesh.rotation.y += dt * 2.8;
    s.mesh.position.y = 2.05 + Math.sin(clock.elapsedTime * 3 + s.x) * 0.24;
    if (Math.hypot(state.pos.x - s.x, state.pos.z - s.z) < 3) {
      s.got = true;
      s.mesh.visible = false;
      state.collected++;
      toast(s.name + ' 정령 조각 획득!');
    }
  }
  $('goal').textContent = '정령 조각 ' + state.collected + ' / ' + spirits.length;
  $('place').textContent = state.place;
  $('stamina').style.width = Math.round(state.stamina * 100) + '%';
  if (state.collected === spirits.length && !update.done) { update.done = true; toast('모든 정령 조각을 모았습니다! ✨'); }
}

const ray = new THREE.Raycaster();
function updateCamera() {
  const target = new THREE.Vector3(state.pos.x, state.pos.y + 1.72, state.pos.z);
  const fwd = new THREE.Vector3(Math.sin(state.heading), 0, Math.cos(state.heading));
  const desired = target.clone().addScaledVector(fwd, -11.0);
  desired.y += 5.3;
  ray.set(target, desired.clone().sub(target).normalize());
  ray.far = target.distanceTo(desired);
  const hits = ray.intersectObjects(scene.children, false).filter(h => h.object !== player && !player.children.includes(h.object) && h.distance < ray.far);
  if (hits.length) desired.copy(target).add(desired.sub(target).normalize().multiplyScalar(Math.max(3.4, hits[0].distance - 1.0)));
  camera.position.lerp(desired, 0.13);
  camera.lookAt(target);
}

const mini = $('mini');
const ctx = mini.getContext('2d');
function drawMini() {
  const w = mini.width;
  const h = mini.height;
  const sc = w / world;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(90,190,105,.88)'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(216,184,121,.95)';
  for (const z of [-42, 0, 42]) ctx.fillRect(0, h / 2 + z * sc - 4, w, 8);
  for (const x of [-42, 0, 42]) ctx.fillRect(w / 2 + x * sc - 4, 0, 8, h);
  ctx.fillStyle = 'rgba(85,202,255,.8)'; ctx.fillRect(0, h / 2 + 56 * sc - 2, w, 4);
  ctx.fillStyle = '#fff06f';
  for (const s of spirits) if (!s.got) { ctx.beginPath(); ctx.arc(w / 2 + s.x * sc, h / 2 + s.z * sc, 3.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.save(); ctx.translate(w / 2 + state.pos.x * sc, h / 2 + state.pos.z * sc); ctx.rotate(-state.heading); ctx.fillStyle = '#ff5d73'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4.5, 5); ctx.lineTo(-4.5, 5); ctx.closePath(); ctx.fill(); ctx.restore();
}

function loop() {
  const dt = Math.min(0.033, clock.getDelta());
  update(dt);
  updateCamera();
  drawMini();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
toast('v3 적용: 셀셰이딩 판타지 비주얼로 업그레이드했습니다.');
loop();
</script>
