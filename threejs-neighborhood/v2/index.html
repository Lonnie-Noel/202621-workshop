<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three.js 동네 오픈월드 v2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:none;user-select:none}#c{display:block;width:100%;height:100%}#hud{position:fixed;left:14px;top:14px;z-index:5;width:min(340px,calc(100vw - 28px));box-sizing:border-box;color:#fff;background:rgba(7,17,31,.76);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:13px 14px;backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.25)}h1{margin:0 0 8px;font-size:17px}.row{display:flex;justify-content:space-between;gap:12px;color:rgba(255,255,255,.72);font-size:13px;margin-top:6px}.v{color:#fff;font-weight:900;text-align:right}.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:10px}#stamina{height:100%;width:100%;background:linear-gradient(90deg,#72ffd7,#8fc8ff)}#tip{margin-top:9px;font-size:12px;color:rgba(255,255,255,.66);line-height:1.45}#mini{position:fixed;right:14px;top:14px;z-index:5;width:126px;height:126px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:rgba(7,17,31,.72);backdrop-filter:blur(10px)}#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;max-width:min(560px,calc(100vw - 28px));color:white;background:rgba(7,17,31,.86);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 15px;opacity:0;transition:.25s;text-align:center;pointer-events:none}#toast.show{opacity:1;bottom:34px}#joy{position:fixed;left:24px;bottom:24px;z-index:7;width:118px;height:118px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:none;touch-action:none}#nub{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.55)}#jump{position:fixed;right:26px;bottom:32px;z-index:7;width:76px;height:76px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(114,255,215,.22);color:white;font-weight:900;display:none;touch-action:none}@media(hover:none),(pointer:coarse){#joy,#jump{display:block}#tip{display:none}#hud{font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<section id="hud"><h1>동네 오픈월드 산책 v2</h1><div class="row"><span>목표</span><span class="v" id="goal">스탬프 0 / 5</span></div><div class="row"><span>현재 위치</span><span class="v" id="place">중앙 광장</span></div><div class="row"><span>카메라</span><span class="v">정중앙 후방 추적</span></div><div class="bar"><div id="stamina"></div></div><div id="tip">WASD 이동 · Shift 달리기 · Space 점프 · 마우스/터치 드래그 방향 전환 · R 리셋</div></section>
<canvas id="mini" width="126" height="126"></canvas><div id="toast"></div><div id="joy"><div id="nub"></div></div><button id="jump">JUMP</button>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,240),renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'}),clock=new THREE.Clock();
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene.background=new THREE.Color(0x8ecaff);scene.fog=new THREE.Fog(0x8ecaff,85,170);
const hemi=new THREE.HemisphereLight(0xffffff,0x6383a3,1.2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-35,70,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=sun.shadow.camera.bottom=-90;sun.shadow.camera.right=sun.shadow.camera.top=90;scene.add(sun);
const mats={grass:mat(0x63bb6f),road:mat(0x303744),walk:mat(0x9aa9ba),roof:mat(0x263244),leaf:mat(0x248c52),wood:mat(0x8a5434),skin:mat(0xffe3bd),shirt:mat(0xffd166),bag:mat(0x4f8cff),red:mat(0xff5d73),blue:mat(0x5aa9ff),lamp:new THREE.MeshStandardMaterial({color:0xffd98b,emissive:0xffb957,emissiveIntensity:.35})};
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.72})}function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}function cyl(r,h,m,x,y,z,s=18){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}function sph(r,m,x,y,z){const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
const world=132,half=world/2,colliders=[];function col(x,z,w,d,label){colliders.push({x,z,w,d,label})}box(world,.16,world,mats.grass,0,-.08,0);for(const z of[-42,0,42])box(world,.08,8,mats.road,0,.02,z);for(const x of[-42,0,42])box(8,.08,world,mats.road,x,.03,0);for(const z of[-47,-37,-5,5,37,47])box(world,.06,2.8,mats.walk,0,.06,z);for(const x of[-47,-37,-5,5,37,47])box(2.8,.06,world,mats.walk,x,.06,0);
function building(x,z,w,d,h,color,label){box(w,h,d,mat(color),x,h/2,z);box(w+.5,.7,d+.5,mats.roof,x,h+.35,z);col(x,z,w+1.2,d+1.2,label);const wm=new THREE.MeshStandardMaterial({color:0xffeca6,emissive:0xffbe65,emissiveIntensity:.08});for(let y=2;y<h-.3;y+=2.2){box(.08,.55,.9,wm,x+w/2+.05,y,z-d*.22);box(.08,.55,.9,wm,x-w/2-.05,y,z+d*.22)}}
const sites=[[-55,-55,10,13,10,0xd98a68,'우체국'],[-24,-58,13,10,8,0x8bb8e8,'문구점'],[24,-57,16,12,15,0xb98be8,'도서관'],[57,-56,12,12,9,0xe8c68b,'빵집'],[-58,-24,12,14,8,0x84d29a,'주택가'],[-24,-24,11,12,7,0xe89a9a,'주택가'],[24,-23,13,13,8,0x7cc7c0,'카페'],[57,-24,12,12,11,0xc0a0ff,'오피스'],[-58,24,15,12,9,0xe0b26b,'시장'],[-24,25,12,12,7,0xa9c76f,'정육점'],[24,24,13,12,8,0x8bd0ff,'약국'],[58,24,12,14,10,0xff9ec5,'꽃집'],[-56,56,12,13,8,0xd6e889,'학교'],[-24,58,13,11,8,0xe8a98b,'분식집'],[25,56,12,13,11,0x88a4e8,'경찰서'],[57,57,13,12,8,0x7edb9c,'주택가']];sites.forEach(s=>building(...s));
cyl(7,.25,mat(0xded5c6),0,.15,0,40);cyl(2.6,.7,new THREE.MeshStandardMaterial({color:0x84d9ff,transparent:true,opacity:.7}),0,.65,0,32);col(0,0,6,6,'분수 광장');box(16,.18,11,mat(0x77c474),-58,.06,0);box(8,.6,1.2,mat(0x5a4638),43,.4,-10);box(10,3,.25,new THREE.MeshStandardMaterial({color:0x77bdf4,transparent:true,opacity:.42}),43,2,-10.8);col(43,-10,9,2,'버스 정류장');
function tree(x,z){cyl(.45,2.6,mats.wood,x,1.3,z,10);sph(2.1,mats.leaf,x,3,z);col(x,z,3.6,3.6,'나무')}for(const p of[[-61,-3],[-54,3],[-58,7],[-64,5]])tree(...p);for(let i=0;i<36;i++){const x=Math.round((Math.random()*118-59)/6)*6,z=Math.round((Math.random()*118-59)/6)*6;if(Math.abs(x)%42<8||Math.abs(z)%42<8||Math.hypot(x,z)<14)continue;tree(x,z)}
for(const [x,z]of[[-6,-6],[6,-6],[-6,6],[6,6],[-42,-8],[-42,8],[42,-8],[42,8],[-8,-42],[8,-42],[-8,42],[8,42]]){cyl(.16,4.3,mat(0x2a3040),x,2.15,z,10);sph(.45,mats.lamp,x,4.55,z)}
const player=new THREE.Group(),body=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,1.9,18),mats.shirt),head=new THREE.Mesh(new THREE.SphereGeometry(.55,20,14),mats.skin),bag=new THREE.Mesh(new THREE.BoxGeometry(.32,.95,.55),mats.bag);body.position.y=1.05;head.position.y=2.35;bag.position.set(0,1.3,.78);for(const o of[body,head,bag]){o.castShadow=o.receiveShadow=true;player.add(o)}scene.add(player);
const stampMat=new THREE.MeshStandardMaterial({color:0xffe66d,emissive:0xffb703,emissiveIntensity:.55,roughness:.35}),stamps=[];for(const [name,x,z]of[['카페',24,-14],['도서관',24,-48],['공원',-58,0],['시장',-48,24],['학교',-56,45]]){const g=new THREE.Group(),star=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,0),stampMat);star.castShadow=true;g.add(star);g.position.set(x,1.8,z);scene.add(g);stamps.push({name,x,z,mesh:g,got:false})}
const cars=[];function car(x,z,axis,dir,m){const g=new THREE.Group(),a=new THREE.Mesh(new THREE.BoxGeometry(3.2,1,1.8),m),b=new THREE.Mesh(new THREE.BoxGeometry(1.55,.72,1.55),mat(0xd6efff));a.position.y=.65;b.position.set(-.25,1.35,0);g.add(a,b);g.position.set(x,0,z);scene.add(g);cars.push({g,axis,dir,speed:7+Math.random()*3})}car(-60,-42,'x',1,mats.red);car(55,0,'x',-1,mats.blue);car(42,58,'z',-1,mats.red);car(-42,-55,'z',1,mats.blue);
const state={pos:new THREE.Vector3(0,0,14),velY:0,heading:Math.PI,stamina:1,collected:0,place:'중앙 광장'},keys=new Set(),joy={on:false,r:0,f:0};let drag=false,lx=0,ly=0;addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space')jump();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('pointerdown',e=>{if(e.target.id==='jump'||e.target.closest('#joy'))return;drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;state.heading-= (e.clientX-lx)*.005;lx=e.clientX;ly=e.clientY});
const joyEl=$('joy'),nub=$('nub');joyEl.addEventListener('pointerdown',e=>{joy.on=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});joyEl.addEventListener('pointermove',moveJoy);joyEl.addEventListener('pointerup',()=>{joy.on=false;joy.r=joy.f=0;nub.style.transform='translate(0,0)'});function moveJoy(e){if(!joy.on)return;const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),vx=Math.cos(a)*len/42,vy=Math.sin(a)*len/42;joy.r=vx;joy.f=-vy;nub.style.transform=`translate(${vx*38}px,${vy*38}px)`}$('jump').addEventListener('pointerdown',jump);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}function jump(){if(state.pos.y<.03)state.velY=7.8}function reset(){state.pos.set(0,0,14);state.velY=0;state.heading=Math.PI;toast('중앙 광장으로 돌아왔습니다.')}
function input(){let r=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);r+=joy.r;f+=joy.f;const v=new THREE.Vector2(r,f);if(v.lengthSq()>1)v.normalize();return v}function blocked(nx,nz){if(nx<-half+2||nx>half-2||nz<-half+2||nz>half-2)return true;for(const c of colliders)if(Math.abs(nx-c.x)<c.w/2+1&&Math.abs(nz-c.z)<c.d/2+1){state.place=c.label;return true}return false}function place(){let best='중앙 광장',bd=999;for(const s of sites){const d=Math.hypot(state.pos.x-s[0],state.pos.z-s[1]);if(d<bd){bd=d;best=s[6]}}if(Math.hypot(state.pos.x+58,state.pos.z)<13)best='작은 공원';if(Math.hypot(state.pos.x,state.pos.z)<10)best='분수 광장';if(Math.abs(state.pos.x)<5||Math.abs(state.pos.z)<5||Math.abs(Math.abs(state.pos.x)-42)<5||Math.abs(Math.abs(state.pos.z)-42)<5)best=best==='분수 광장'?best:'도로';state.place=best}
function dampAngle(a,b,k,dt){const d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*(1-Math.exp(-k*dt))}function update(dt){const inp=input(),run=(keys.has('ShiftLeft')||keys.has('ShiftRight'))&&inp.lengthSq()>.01&&state.stamina>.05,speed=run?12:7.2;if(run)state.stamina=Math.max(0,state.stamina-dt*.23);else state.stamina=Math.min(1,state.stamina+dt*.16);const fwd=new THREE.Vector3(Math.sin(state.heading),0,Math.cos(state.heading)),right=new THREE.Vector3(-Math.cos(state.heading),0,Math.sin(state.heading)),move=fwd.multiplyScalar(inp.y).add(right.multiplyScalar(inp.x));if(move.lengthSq()>1)move.normalize();const dx=move.x*speed*dt,dz=move.z*speed*dt;if(!blocked(state.pos.x+dx,state.pos.z))state.pos.x+=dx;if(!blocked(state.pos.x,state.pos.z+dz))state.pos.z+=dz;state.velY-=22*dt;state.pos.y=Math.max(0,state.pos.y+state.velY*dt);if(state.pos.y===0)state.velY=0;if(move.lengthSq()>.001){const h=Math.atan2(move.x,move.z);state.heading=dampAngle(state.heading,h,8,dt);player.rotation.y=state.heading-Math.PI;body.scale.y=1+Math.sin(clock.elapsedTime*12)*.035}player.position.copy(state.pos);place();for(const c of cars){c.g.position[c.axis]+=c.dir*c.speed*dt;if(c.g.position[c.axis]>66)c.g.position[c.axis]=-66;if(c.g.position[c.axis]<-66)c.g.position[c.axis]=66;c.g.rotation.y=c.axis==='x'?(c.dir>0?Math.PI/2:-Math.PI/2):(c.dir>0?0:Math.PI)}for(const s of stamps){if(s.got)continue;s.mesh.rotation.y+=dt*2.5;s.mesh.position.y=1.9+Math.sin(clock.elapsedTime*3+s.x)*.22;if(Math.hypot(state.pos.x-s.x,state.pos.z-s.z)<3){s.got=true;s.mesh.visible=false;state.collected++;toast(`${s.name} 스탬프 획득!`)}}$('goal').textContent=`스탬프 ${state.collected} / ${stamps.length}`;$('place').textContent=state.place;$('stamina').style.width=`${Math.round(state.stamina*100)}%`;if(state.collected===stamps.length&&!update.done){update.done=true;toast('모든 스탬프를 모았습니다! 🎉')}}
const ray=new THREE.Raycaster();function cam(){const target=new THREE.Vector3(state.pos.x,state.pos.y+1.7,state.pos.z),fwd=new THREE.Vector3(Math.sin(state.heading),0,Math.cos(state.heading)),desired=target.clone().addScaledVector(fwd,-10.8);desired.y+=5.4;ray.set(target,desired.clone().sub(target).normalize());ray.far=target.distanceTo(desired);const hits=ray.intersectObjects(scene.children,false).filter(h=>h.object!==player&&!player.children.includes(h.object)&&h.distance<ray.far);if(hits.length)desired.copy(target).add(desired.sub(target).normalize().multiplyScalar(Math.max(3.2,hits[0].distance-1)));camera.position.lerp(desired,.13);camera.lookAt(target)}
const mini=$('mini'),ctx=mini.getContext('2d');function drawMini(){const w=mini.width,h=mini.height,sc=w/world;ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(80,180,100,.85)';ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(40,45,55,.9)';for(const z of[-42,0,42])ctx.fillRect(0,h/2+z*sc-4,w,8);for(const x of[-42,0,42])ctx.fillRect(w/2+x*sc-4,0,8,h);ctx.fillStyle='#ffd84d';for(const s of stamps)if(!s.got){ctx.beginPath();ctx.arc(w/2+s.x*sc,h/2+s.z*sc,3,0,Math.PI*2);ctx.fill()}ctx.save();ctx.translate(w/2+state.pos.x*sc,h/2+state.pos.z*sc);ctx.rotate(-state.heading);ctx.fillStyle='#ff5d73';ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(4,5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();ctx.restore()}
function loop(){const dt=Math.min(.033,clock.getDelta());update(dt);cam();drawMini();renderer.render(scene,camera);requestAnimationFrame(loop)}toast('v2 적용: 조이스틱 방향과 정중앙 후방 카메라를 보정했습니다.');loop();
</script>
</body>
</html>
